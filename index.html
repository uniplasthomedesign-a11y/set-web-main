<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#254496" />
    <meta name="description" content="Découvrez le catalogue UNIPLAST : emballage, conservation, rangement et équipement de la maison. Commandez par carton et consultez votre bon de commande." />
    <title>UNIPLAST — Des solutions pour chaque jour</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UNIPLAST" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        var t = localStorage.getItem("uniplast.storefront-theme.v1");
        if (
          !location.hash.startsWith("#/admin") &&
          [
            "classic",
            "ramadan-night",
            "ramadan-ivory",
            "newyear-snow",
            "newyear-midnight",
          ].indexOf(t) !== -1
        )
          document.documentElement.dataset.storefrontTheme = t;
        var m = localStorage.getItem("uniplast.menu-style.v1");
        if (
          !location.hash.startsWith("#/admin") &&
          ["floating", "classic", "sheet"].indexOf(m) !== -1
        )
          document.documentElement.dataset.menuStyle = m;
      } catch (_) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
